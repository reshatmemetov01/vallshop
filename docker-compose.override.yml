# Авто-подключается Docker Compose при обычном `docker compose up -d`.
#
# Публикует веб-порт бота ТОЛЬКО на localhost (127.0.0.1:8080), чтобы хостовый
# nginx (shop.vallshop.com → http://127.0.0.1:8080) мог отдавать публичные
# страницы (оферта/лендинг/соглашение/политика) и вебхук оплаты.
#
# Без этой публикации nginx не видит бота и отвечает 502 Bad Gateway на всех
# веб-страницах — хотя сам бот работает. Наружу порт не торчит (только 127.0.0.1).
#
# Если домен/вебхук НЕ используются — файл безвреден (порт слушает лишь localhost).
services:
  bot:
    ports:
      - "127.0.0.1:8080:8080"
