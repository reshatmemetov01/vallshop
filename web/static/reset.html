<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop — новый пароль</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ff8a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{--bg:#13100e;--bg2:#0e0c0a;--panel:#1d1813;--line2:#43382b;--text:#f7f2ec;--muted:#bcae9e;
    --accent:#ff8a2e;--accent2:#ffc27a;--accent-ink:#2a1505;--grad:linear-gradient(135deg,#ffb24d,#ff6f1e)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--text);
    background:radial-gradient(900px 440px at 50% -10%, rgba(255,122,43,.12), transparent 65%),var(--bg);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  .card{width:100%;max-width:420px;background:linear-gradient(180deg,#1c1710,#171310);border:1px solid var(--line2);
    border-radius:20px;padding:30px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .logo{font-family:"Kaushan Script",cursive;font-size:30px;color:#fff;margin-bottom:16px;text-align:center;line-height:1}.logo span{color:var(--accent)}
  h1{font-size:20px;margin:0 0 16px;text-align:center;font-weight:800}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;
    padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.14)}
  .btn{width:100%;margin-top:18px;background:var(--grad);color:var(--accent-ink);border:none;
    border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.55;cursor:default;filter:none}
  .msg{margin-top:14px;font-size:14px;min-height:20px}.msg.err{color:#ffb3b5}.msg.ok{color:#9fe8bd}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  .foot{text-align:center;margin-top:16px}.foot a{color:var(--accent2);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Vall<span>Shop</span></div>
    <h1>Новый пароль</h1>
    <form id="form" onsubmit="return submitForm(event)">
      <label>Новый пароль</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="••••••••" required>
      <div class="hint">Минимум 8 символов</div>
      <label>Повторите пароль</label>
      <input id="password2" type="password" autocomplete="new-password" placeholder="••••••••" required>
      <button id="submit" class="btn" type="submit">Сохранить пароль</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="foot"><a href="/login">← ко входу</a></div>
  </div>
<script>
const $ = (id)=>document.getElementById(id);
const token = new URLSearchParams(location.search).get("token");
function msg(t, ok){ const m=$("msg"); m.textContent=t||""; m.className="msg"+(t?(ok?" ok":" err"):""); }
if(!token){ msg("Ссылка неполная — нет кода сброса."); $("submit").disabled = true; }

async function submitForm(e){
  e.preventDefault();
  const p1 = $("password").value, p2 = $("password2").value;
  if(p1.length < 8){ msg("Пароль минимум 8 символов."); return false; }
  if(p1 !== p2){ msg("Пароли не совпадают."); return false; }
  $("submit").disabled = true; msg("");
  try{
    const r = await fetch("/api/auth/reset", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({token, password:p1})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ msg(data.detail || "Не удалось сменить пароль."); $("submit").disabled=false; return false; }
    localStorage.setItem("vs_token", data.token);
    msg("Пароль изменён. Входим…", true);
    setTimeout(()=>{ location.href = "/"; }, 700);
  }catch(err){ msg("Нет связи с сервером."); $("submit").disabled=false; }
  return false;
}
</script>
</body>
</html>
