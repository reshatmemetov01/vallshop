<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VallShop — Админ-панель</title>
<style>
  :root{
    --bg:#0a0f1a; --bg2:#060a12; --panel:#141d2a; --panel2:#1b2636;
    --line:#2a3a4a; --line2:#394b5e; --text:#eef4f8; --muted:#a3b4c2; --dim:#78889a;
    --accent:#3ba3f0; --accent2:#7cc6f7; --grad:linear-gradient(135deg,#2aabee,#229ed9);
    --ok:#4fd08a; --bad:#ff6b6b; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(1000px 500px at 50% -10%, rgba(56,132,246,.14), transparent 60%), var(--bg);
    color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;line-height:1.5}
  a{color:var(--accent2);text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line);background:rgba(10,15,26,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .bar{display:flex;align-items:center;gap:14px;padding:14px 0}
  .logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}
  .bar .sp{margin-left:auto}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14px}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--text)}
  .btn:disabled{opacity:.5;cursor:default}
  /* Логин */
  .login{max-width:360px;margin:12vh auto;background:linear-gradient(180deg,var(--panel),#0f1724);
    border:1px solid var(--line2);border-radius:18px;padding:26px}
  .login h1{font-size:20px;margin:0 0 4px}.login p{color:var(--muted);font-size:14px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,171,238,.14)}
  .msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
  /* Дашборд */
  h2{font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
  .presets button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
  .presets button.on{background:var(--grad);border:none;color:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:linear-gradient(180deg,var(--panel),#0f1724);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card .k{color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .card .v{font-size:24px;font-weight:800;margin-top:6px}
  .card .v small{font-size:13px;color:var(--muted);font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  /* График визитов */
  .chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
  .chart .col{flex:1 0 8px;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .chart .bar{width:100%;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px}
  .chart .lbl{font-size:9px;color:var(--dim);white-space:nowrap;transform:rotate(-45deg);transform-origin:center;margin-top:6px}
  /* Таблица пользователей */
  .srow{display:flex;gap:10px;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
  .tag.ok{color:#bff3d2;border-color:rgba(79,208,138,.4)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  .state{color:var(--muted);text-align:center;padding:24px}
  @media (max-width:640px){ .card .v{font-size:20px} h2{font-size:16px} }
</style>
</head>
<body>

<div id="loginView" style="display:none">
  <div class="login">
    <h1>🔐 Админ-панель</h1>
    <p>Вход только для владельца.</p>
    <label>Логин</label>
    <input id="lu" type="text" autocomplete="username">
    <label>Пароль</label>
    <input id="lp" type="password" autocomplete="current-password">
    <div class="msg" id="lmsg"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Войти</button>
  </div>
</div>

<div id="appView" style="display:none">
  <header><div class="wrap bar">
    <div class="logo">Vall<span>Shop</span> · админ</div>
    <div class="sp"></div>
    <button class="btn ghost" onclick="logout()">Выйти</button>
  </div></header>
  <div class="wrap" style="padding-bottom:50px">
    <div class="presets" id="presets"></div>

    <h2>📊 Общее (бот + сайт)</h2>
    <div class="cards" id="totalCards"></div>

    <h2>🤖 Бот</h2>
    <div class="cards" id="botCards"></div>

    <h2>🌐 Сайт</h2>
    <div class="cards" id="siteCards"></div>

    <h2>👁 Посещения сайта</h2>
    <div class="hint" style="color:var(--dim);font-size:13px;margin:-6px 0 12px">
      Считаются только живые люди — боты и краулеры не учитываются.
      <a href="#" id="notrackLink" target="_blank" style="color:var(--accent2)">Не считать мои визиты →</a>
    </div>
    <div class="cards" id="visitCards"></div>
    <div class="chart" id="chart"></div>

    <h2>📧 Пользователи сайта</h2>
    <div class="srow">
      <input id="uq" type="search" placeholder="Поиск по email…" oninput="onSearch()">
    </div>
    <div class="tbl-wrap"><table id="usersTbl"><tbody></tbody></table></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const TK = "vs_admin_token";
let preset = "7d";
function tok(){ try{return localStorage.getItem(TK);}catch(e){return null;} }
async function api(path, opts){
  const o = opts || {};
  o.headers = Object.assign({"Authorization":"Bearer "+tok()}, o.headers||{});
  const r = await fetch(path, o);
  if(r.status===401){ logout(); throw new Error("unauth"); }
  return r.json();
}
const rub = n => (n==null?"—":(Number.isInteger(n)?n:Number(n).toFixed(2))+" ₽");

function show(view){ $("loginView").style.display = view==="login"?"":"none"; $("appView").style.display = view==="app"?"":"none"; }

async function doLogin(){
  const username = $("lu").value.trim(), password = $("lp").value;
  $("lmsg").textContent = "Входим…";
  try{
    const r = await fetch("/api/admin/login", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ $("lmsg").textContent = d.detail || "Ошибка входа"; return; }
    localStorage.setItem(TK, d.token);
    boot();
  }catch(e){ $("lmsg").textContent = "Нет связи с сервером"; }
}
function logout(){ try{localStorage.removeItem(TK);}catch(e){} show("login"); }

function card(k, v, sub){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`; }

function renderPresets(){
  const opts = [["today","Сегодня"],["7d","7 дней"],["30d","30 дней"],["all","Всё время"]];
  $("presets").innerHTML = opts.map(([k,l])=>`<button class="${preset===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join("");
}
function setPreset(p){ preset=p; renderPresets(); loadOverview(); }

async function loadOverview(){
  try{
    const d = await api("/api/admin/overview?preset="+preset);
    const t = d.total, b = d.bot, s = d.site, v = d.visits;
    $("totalCards").innerHTML =
      card("Клиенты", `${t.users_total}<small> + ${t.accounts_total} сайт</small>`) +
      card("Заказы всего", t.orders, "бот + сайт") +
      card("Выручка всего", rub(t.revenue_rub)) +
      card("Пополнения всего", rub(t.topups_rub), `${t.topups} шт.`) +
      card("Баланс клиентов", rub(t.balance_rub));
    $("botCards").innerHTML =
      card("Пользователи", b.users_total, `+${b.users_new} за период`) +
      card("Активные", b.active, `неактивных: ${b.inactive}`) +
      card("Заказы", b.orders, "завершённые") +
      card("Выручка", rub(b.revenue_rub)) +
      card("Пополнения", rub(b.topups_rub), `${b.topups} шт.`);
    $("siteCards").innerHTML =
      card("Аккаунты сайта", s.accounts_total, `+${s.accounts_new} за период`) +
      card("Заказы с сайта", s.orders) +
      card("Выручка сайта", rub(s.revenue_rub)) +
      card("Пополнения", rub(s.topups_rub), `${s.topups} шт.`) +
      card("Активации кодов", s.activations);
    $("visitCards").innerHTML =
      card("Сегодня", v.today.hits, `уникальных: ${v.today.unique}`) +
      card("7 дней", v.d7.hits, `уникальных: ${v.d7.unique}`) +
      card("Всего", v.all.hits, `уникальных: ${v.all.unique}`);
  }catch(e){}
}

async function loadVisits(){
  try{
    const d = await api("/api/admin/visits?days=30");
    const rows = d.daily||[];
    const max = Math.max(1, ...rows.map(r=>r.hits));
    $("chart").innerHTML = rows.length ? rows.map(r=>`
      <div class="col" title="${r.day}: ${r.hits} визитов, ${r.unique} уник.">
        <div class="bar" style="height:${Math.round(r.hits/max*96)}px"></div>
        <div class="lbl">${r.day.slice(5)}</div>
      </div>`).join("") : '<div class="state">Нет данных о посещениях.</div>';
  }catch(e){}
}

let _st=null;
function onSearch(){ clearTimeout(_st); _st=setTimeout(loadUsers,300); }
async function loadUsers(){
  const q = $("uq").value.trim();
  try{
    const d = await api("/api/admin/users?limit=100&q="+encodeURIComponent(q));
    const tb = $("usersTbl").querySelector("tbody");
    if(!d.items.length){ tb.innerHTML = '<tr><td class="state">Нет пользователей.</td></tr>'; return; }
    tb.innerHTML = `<tr><th>#</th><th>Email</th><th>Баланс</th><th>TG</th><th>Email ✓</th><th>Регистрация</th></tr>` +
      d.items.map(u=>`<tr>
        <td>${u.id}</td>
        <td>${esc(u.email||"— (Telegram)")}</td>
        <td>${rub(u.balance_rub)}</td>
        <td>${u.telegram_linked?'<span class="tag ok">да</span>':'<span class="tag">нет</span>'}</td>
        <td>${u.email_verified?'<span class="tag ok">да</span>':'<span class="tag">нет</span>'}</td>
        <td>${fmtDate(u.created_at)}</td>
      </tr>`).join("");
  }catch(e){}
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ if(!iso) return "—"; try{ return new Date(iso).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){ return iso; } }

async function boot(){
  show("app");
  renderPresets();
  // Ссылка «не считать мои визиты» ведёт на основной сайт (без поддомена admin.).
  const site = location.origin.replace("://admin.", "://");
  const nl = $("notrackLink"); if(nl) nl.href = site + "/notrack";
  await Promise.all([loadOverview(), loadVisits(), loadUsers()]);
}

if(tok()){ boot(); } else { show("login"); }
</script>
</body>
</html>
