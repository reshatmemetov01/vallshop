<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop — вход</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ff8a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13100e; --bg2:#0e0c0a; --panel:#1d1813; --panel2:#251f18; --line:#352c22; --line2:#43382b;
    --text:#f7f2ec; --muted:#bcae9e; --dim:#8c7f70; --accent:#ff8a2e; --accent2:#ffc27a; --accent-ink:#2a1505;
    --grad:linear-gradient(135deg,#ffb24d 0%,#ff6f1e 100%); --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--text);
    background:radial-gradient(900px 440px at 50% -10%, rgba(255,122,43,.12), transparent 65%),var(--bg);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:var(--accent2);text-decoration:none}
  header{border-bottom:1px solid var(--line);background:rgba(14,15,19,.6);backdrop-filter:blur(10px)}
  .bar{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .logo{font-family:"Kaushan Script",cursive;font-size:28px;color:#fff;line-height:1;padding-bottom:3px}
  .logo span{color:var(--accent)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:410px;background:linear-gradient(180deg,#1c1710,#171310);
    border:1px solid var(--line2);border-radius:20px;padding:26px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .tabs{display:flex;gap:6px;background:var(--bg2);border-radius:12px;padding:5px;margin-bottom:18px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:10px;border-radius:9px;
    cursor:pointer;font-weight:700;font-size:15px;font-family:inherit;transition:.15s}
  .tabs button.active{background:var(--grad);color:var(--accent-ink)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;
    padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.14)}
  .btn{width:100%;margin-top:18px;background:var(--grad);color:var(--accent-ink);border:none;
    border-radius:12px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.55;cursor:default;filter:none}
  .tg{margin-top:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line2);
    width:100%;border-radius:11px;padding:11px;font-weight:600;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;min-height:20px}
  .msg.err{color:#ffb3b5}.msg.ok{color:#9fe8bd}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
  .foot a{color:var(--accent2)}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  .orline{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;margin:18px 0 12px}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line2)}
  .tgwrap{display:flex;justify-content:center;min-height:40px}
</style>
</head>
<body>
<header><div class="bar"><a href="/" class="logo">Vall<span>Shop</span></a></div></header>
<main>
  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="active" onclick="setTab('login')">Вход</button>
      <button id="tab-reg" onclick="setTab('reg')">Регистрация</button>
    </div>

    <form id="form" onsubmit="return submitForm(event)">
      <label>Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label>Пароль</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <div id="pwhint" class="hint" style="display:none">Минимум 8 символов</div>
      <button id="submit" class="btn" type="submit">Войти</button>
    </form>

    <div class="orline"><span>или</span></div>
    <div id="tgwrap" class="tgwrap">
      <div id="tgbtn"></div>
      <button class="tg" id="tgsoon" disabled style="display:none">Войти через Telegram · скоро</button>
    </div>

    <div id="msg" class="msg"></div>
    <div class="foot">
      <a href="#" id="forgot" onclick="return forgotPassword()">Забыли пароль?</a>
      &nbsp;·&nbsp; <a href="/">← на витрину</a>
    </div>
  </div>
</main>

<script>
const $ = (id)=>document.getElementById(id);
let tab = "login";

function setTab(t){
  tab = t;
  $("tab-login").classList.toggle("active", t==="login");
  $("tab-reg").classList.toggle("active", t==="reg");
  $("submit").textContent = t==="login" ? "Войти" : "Создать аккаунт";
  $("password").setAttribute("autocomplete", t==="login" ? "current-password" : "new-password");
  $("pwhint").style.display = t==="reg" ? "block" : "none";
  msg("");
}
function msg(text, ok){ const m=$("msg"); m.textContent=text||""; m.className="msg"+(text?(ok?" ok":" err"):""); }

async function submitForm(e){
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  const path = tab==="login" ? "/api/auth/login" : "/api/auth/register";
  $("submit").disabled = true; msg("");
  try{
    const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email, password})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ msg(data.detail || "Ошибка. Попробуйте ещё раз."); $("submit").disabled=false; return false; }
    localStorage.setItem("vs_token", data.token);
    msg(tab==="login" ? "Вход выполнен. Перенаправляем…" : "Аккаунт создан. Перенаправляем…", true);
    setTimeout(()=>{ location.href = "/"; }, 600);
  }catch(err){ msg("Нет связи с сервером."); $("submit").disabled=false; }
  return false;
}

// сброс пароля: отправить письмо со ссылкой
async function forgotPassword(){
  let email = $("email").value.trim();
  if(!email){ email = (prompt("Укажите email вашего аккаунта:") || "").trim(); }
  if(!email){ return false; }
  try{
    await fetch("/api/auth/forgot", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({email})});
    msg("Если такой email зарегистрирован, мы отправили на него ссылку для сброса пароля.", true);
  }catch(e){ msg("Нет связи с сервером."); }
  return false;
}

// стартовая вкладка: /register → регистрация
if(location.pathname.endsWith("/register")) setTab("reg");

// вход через Telegram прошёл — отправляем данные виджета на сервер
window.onTelegramAuth = async function(user){
  msg("Проверяем Telegram…", true);
  try{
    // если пользователь уже вошёл — передаём токен: это привязка, а не новый вход
    const headers = {"Content-Type":"application/json"};
    const tok = localStorage.getItem("vs_token");
    if(tok) headers["Authorization"] = "Bearer " + tok;
    const r = await fetch("/api/auth/telegram", {method:"POST",
      headers, body: JSON.stringify(user)});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ msg(data.detail || "Не удалось войти через Telegram."); return; }
    localStorage.setItem("vs_token", data.token);
    msg("Вход через Telegram выполнен. Перенаправляем…", true);
    setTimeout(()=>{ location.href = "/"; }, 600);
  }catch(err){ msg("Нет связи с сервером."); }
};

// подгружаем виджет Telegram, только если задано имя бота на сервере
(async ()=>{
  try{
    const cfg = await (await fetch("/api/auth/config")).json();
    if(!cfg.telegram_bot_username){ $("tgsoon").style.display="block"; return; }
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.setAttribute("data-telegram-login", cfg.telegram_bot_username);
    s.setAttribute("data-size", "large");
    s.setAttribute("data-radius", "10");
    s.setAttribute("data-onauth", "onTelegramAuth(user)");
    s.setAttribute("data-request-access", "write");
    $("tgbtn").appendChild(s);
  }catch(err){ $("tgsoon").style.display="block"; }
})();
</script>
</body>
</html>
