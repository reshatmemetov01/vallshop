<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1f242d; --line:#2a303a;
    --text:#e8edf3; --muted:#8b96a5; --accent:#ff7a2f; --accent2:#2fb4a6;
    --ok:#36c26b; --bad:#e5484d; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:14px 0}
  .logo{font-weight:800;font-size:20px;letter-spacing:.3px}
  .logo span{color:var(--accent)}
  .wip{margin-left:auto;font-size:12px;color:#ffd9bf;background:#3a2414;
    border:1px solid #5a3a22;padding:5px 10px;border-radius:999px}
  .auth{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
  .auth .email{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth .bal{color:var(--ok);font-weight:700;background:#0f2f1e;border:1px solid #1e5a37;
    padding:5px 11px;border-radius:999px}
  .auth .topup{background:var(--accent)!important;color:#1a0f07!important;border:none!important;
    font-weight:700!important}
  /* модалка пополнения */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
    justify-content:center;z-index:20;padding:16px}
  .ovl.show{display:flex}
  .modal{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px}
  .modal h3{margin:0 0 16px;font-size:18px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  .modal input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;color:var(--text);font-size:16px}
  .modal input:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;
    border-radius:999px;cursor:pointer;font-size:14px}
  .chip:hover{border-color:var(--accent)}
  .methods{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .method{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:600}
  .method.sel{border-color:var(--accent);background:#2a1a0e}
  .modal .row{display:flex;gap:10px;margin-top:18px}
  .modal .pay{flex:1;background:var(--accent);color:#1a0f07;border:none;border-radius:10px;
    padding:12px;font-weight:700;font-size:15px;cursor:pointer}
  .modal .pay:disabled{opacity:.6;cursor:default}
  .modal .cancel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px 16px;cursor:pointer}
  .modal .mmsg{margin-top:12px;font-size:14px;min-height:18px;color:#ffb3b5}
  .modal .hint{color:var(--muted);font-size:12px;margin-top:6px}
  .loginbtn{background:var(--accent);color:#1a0f07;padding:7px 15px;border-radius:999px;font-weight:700}
  .auth button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
  h1{font-size:18px;margin:20px 0 6px}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    color:var(--muted);font-size:14px;margin:18px 0 10px}
  .crumbs b{color:var(--text)}
  .crumbs .sep{opacity:.5}
  .back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    color:var(--accent2);font-size:14px;margin:10px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;margin:12px 0 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .t{font-weight:600}
  .card .arrow{margin-top:auto;color:var(--muted);font-size:13px}
  .vlist{display:flex;flex-direction:column;gap:10px;margin:12px 0 40px}
  .vrow{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .vrow .vt{font-weight:600;flex:1 1 180px;min-width:0}
  .vrow .desc{flex-basis:100%;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .price{font-weight:700;font-size:17px;white-space:nowrap}
  .price small{color:var(--muted);font-weight:500;font-size:12px}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.ok{color:#bff3d2;background:#0f2f1e;border:1px solid #1e5a37}
  .badge.bad{color:#ffd0d2;background:#2f1314;border:1px solid #5a2122}
  .buy{background:var(--accent);color:#1a0f07;border:none;border-radius:10px;
    padding:9px 16px;font-weight:700;cursor:not-allowed;opacity:.65}
  .state{color:var(--muted);padding:40px 0;text-align:center}
  footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);
    padding:20px 0 40px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Vall<span>Shop</span></div>
  <div id="auth" class="auth"></div>
</div></header>

<main class="wrap">
  <div id="crumbs" class="crumbs"></div>
  <div id="content"><div class="state">Загрузка каталога…</div></div>
</main>

<div id="ovl" class="ovl">
  <div class="modal">
    <h3>Пополнить баланс</h3>
    <label>Сумма, ₽</label>
    <input id="amount" type="number" inputmode="numeric" min="50" step="1" placeholder="например, 500">
    <div class="chips" id="chips"></div>
    <div id="mhint" class="hint"></div>
    <label>Способ оплаты</label>
    <div id="methods" class="methods"><div class="hint">Загрузка способов…</div></div>
    <div class="mmsg" id="mmsg"></div>
    <div class="row">
      <button class="cancel" onclick="closeTopup()">Отмена</button>
      <button class="pay" id="paybtn" onclick="doTopup()" disabled>Перейти к оплате</button>
    </div>
  </div>
</div>

<footer class="wrap">VallShop · покупка товаров появится на следующем этапе.</footer>

<script>
const $ = (id) => document.getElementById(id);
const content = $("content"), crumbs = $("crumbs");
let stack = [];  // хлебные крошки: [{id, title}]

const rub = (n) => (n == null ? "—" : (Number.isInteger(n) ? n : n.toFixed(2)) + " ₽");

async function api(path){
  const r = await fetch(path, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function renderCrumbs(){
  const parts = ['<b style="cursor:pointer" onclick="goHome()">🏠 Каталог</b>'];
  stack.forEach((s, i) => {
    parts.push('<span class="sep">›</span>');
    const last = i === stack.length - 1;
    parts.push(last ? `<b>${esc(s.title)}</b>`
      : `<span style="cursor:pointer" onclick="goTo(${i})">${esc(s.title)}</span>`);
  });
  crumbs.innerHTML = parts.join(" ");
}

function esc(s){return (s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function productCard(p){
  const sub = p.has_children ? "📂 открыть" : "выбрать номинал";
  return `<div class="card" onclick="open_(${p.id}, '${esc(p.title).replace(/'/g,"\\'")}')">
    <div class="t">${esc(p.title)}</div>
    <div class="arrow">${sub} →</div></div>`;
}

function variantRow(v){
  const price = v.price_rub == null ? "—" :
    `${rub(v.price_rub)}${v.per_1000 ? ' <small>/ 1000</small>' : ''}`;
  const badge = v.available
    ? `<span class="badge ok">${v.source==='stock' && v.stock!=null ? 'в наличии: '+v.stock : 'в наличии'}</span>`
    : `<span class="badge bad">нет в наличии</span>`;
  const lim = v.per_1000 && v.smm_min ? `<div class="desc">Количество: от ${v.smm_min} до ${v.smm_max||'—'}</div>` : '';
  const desc = v.description ? `<div class="desc">${esc(v.description)}</div>` : '';
  return `<div class="vrow">
    <div class="vt">${esc(v.title)}</div>
    <div class="price">${price}</div>
    ${badge}
    <button class="buy" title="Покупка появится на следующем этапе" disabled>Купить</button>
    ${lim}${desc}
  </div>`;
}

async function goHome(){
  stack = [];
  renderCrumbs();
  content.innerHTML = '<div class="state">Загрузка…</div>';
  try{
    const data = await api("/api/catalog");
    if(!data.products.length){ content.innerHTML = '<div class="state">Каталог пуст.</div>'; return; }
    content.innerHTML = `<div class="grid">${data.products.map(productCard).join("")}</div>`;
  }catch(e){ content.innerHTML = '<div class="state">Не удалось загрузить каталог.</div>'; }
}

async function open_(id, title){
  stack.push({id, title});
  renderCrumbs();
  content.innerHTML = '<div class="state">Загрузка…</div>';
  try{
    const data = await api("/api/catalog/" + id);
    if(data.type === "category"){
      content.innerHTML = `<div class="grid">${data.children.map(productCard).join("")}</div>`;
    } else {
      const rows = data.variants.map(variantRow).join("");
      content.innerHTML = rows
        ? `<div class="vlist">${rows}</div>`
        : '<div class="state">Нет доступных номиналов.</div>';
    }
  }catch(e){ content.innerHTML = '<div class="state">Не удалось загрузить товар.</div>'; }
}

function goTo(i){
  const target = stack[i];
  stack = stack.slice(0, i);
  open_(target.id, target.title);
}

async function initAuth(){
  const el = $("auth");
  const token = localStorage.getItem("vs_token");
  if(!token){ el.innerHTML = '<a class="loginbtn" href="/login">Войти</a>'; return; }
  try{
    const r = await fetch("/api/auth/me", {headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw 0;
    const me = await r.json();
    const name = me.email || "Telegram";
    const bal = `<span class="bal">${rub(me.balance_rub)}</span>`;
    const link = me.telegram_linked ? "" :
      '<a class="loginbtn" href="/login" style="font-size:13px;padding:6px 12px">+ Telegram</a>';
    el.innerHTML = `${bal}<button class="topup" onclick="openTopup()">Пополнить</button>`
      + `<span class="email">${esc(name)}</span>${link}<button onclick="logout()">Выйти</button>`;
  }catch(e){
    localStorage.removeItem("vs_token");
    el.innerHTML = '<a class="loginbtn" href="/login">Войти</a>';
  }
}
function logout(){ localStorage.removeItem("vs_token"); location.reload(); }

// ── Пополнение баланса ───────────────────────────────────────────────────────
let topupMethod = null, topupMin = 50, topupMax = 50000;

async function openTopup(){
  const token = localStorage.getItem("vs_token");
  if(!token){ location.href = "/login"; return; }
  $("ovl").classList.add("show");
  $("mmsg").textContent = "";
  $("amount").value = "";
  topupMethod = null;
  try{
    const cfg = await api("/api/topup/methods");
    topupMin = cfg.min; topupMax = cfg.max;
    $("mhint").textContent = `От ${topupMin} до ${topupMax} ₽`;
    $("chips").innerHTML = [100,300,500,1000,3000].map(a =>
      `<span class="chip" onclick="setAmount(${a})">${a} ₽</span>`).join("");
    if(!cfg.methods.length){
      $("methods").innerHTML = '<div class="hint">Способы оплаты временно недоступны.</div>';
      return;
    }
    $("methods").innerHTML = cfg.methods.map(m =>
      `<div class="method" id="m-${m.id}" onclick="selMethod('${m.id}')">${esc(m.label)}</div>`).join("");
  }catch(e){
    $("methods").innerHTML = '<div class="hint">Не удалось загрузить способы оплаты.</div>';
  }
}
function closeTopup(){ $("ovl").classList.remove("show"); }
function setAmount(a){ $("amount").value = a; refreshPay(); }
function selMethod(id){
  topupMethod = id;
  document.querySelectorAll(".method").forEach(e => e.classList.remove("sel"));
  const el = $("m-"+id); if(el) el.classList.add("sel");
  refreshPay();
}
function refreshPay(){
  const amt = parseFloat($("amount").value);
  const ok = topupMethod && amt >= topupMin && amt <= topupMax;
  $("paybtn").disabled = !ok;
}
async function doTopup(){
  const token = localStorage.getItem("vs_token");
  const amount = String($("amount").value).trim();
  $("paybtn").disabled = true; $("mmsg").textContent = "";
  try{
    const r = await fetch("/api/topup", {method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body: JSON.stringify({amount, method: topupMethod})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !data.checkout_url){
      $("mmsg").textContent = data.detail || "Не удалось создать счёт.";
      refreshPay(); return;
    }
    // уходим на страницу оплаты провайдера; после оплаты вернёмся на сайт
    location.href = data.checkout_url;
  }catch(e){ $("mmsg").textContent = "Нет связи с сервером."; refreshPay(); }
}
document.getElementById("amount").addEventListener("input", refreshPay);
document.getElementById("ovl").addEventListener("click", (e)=>{ if(e.target.id==="ovl") closeTopup(); });

initAuth();
goHome();
</script>
</body>
</html>
