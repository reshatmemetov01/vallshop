<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1f242d; --line:#2a303a;
    --text:#e8edf3; --muted:#8b96a5; --accent:#ff7a2f; --accent2:#2fb4a6;
    --ok:#36c26b; --bad:#e5484d; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:14px 0}
  .logo{font-weight:800;font-size:20px;letter-spacing:.3px}
  .logo span{color:var(--accent)}
  .wip{margin-left:auto;font-size:12px;color:#ffd9bf;background:#3a2414;
    border:1px solid #5a3a22;padding:5px 10px;border-radius:999px}
  .auth{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
  .auth .email{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth .bal{color:var(--ok);font-weight:700;background:#0f2f1e;border:1px solid #1e5a37;
    padding:5px 11px;border-radius:999px}
  .auth .topup{background:var(--accent)!important;color:#1a0f07!important;border:none!important;
    font-weight:700!important}
  /* модалка пополнения */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
    justify-content:center;z-index:20;padding:16px}
  .ovl.show{display:flex}
  .modal{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px}
  .modal h3{margin:0 0 16px;font-size:18px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  .modal input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;color:var(--text);font-size:16px}
  .modal input:focus{outline:none;border-color:var(--accent)}
  .modal select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;color:var(--text);font-size:15px;margin-top:6px}
  .modal select:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;
    border-radius:999px;cursor:pointer;font-size:14px}
  .chip:hover{border-color:var(--accent)}
  .methods{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .method{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:600}
  .method.sel{border-color:var(--accent);background:#2a1a0e}
  .modal .row{display:flex;gap:10px;margin-top:18px}
  .modal .pay{flex:1;background:var(--accent);color:#1a0f07;border:none;border-radius:10px;
    padding:12px;font-weight:700;font-size:15px;cursor:pointer}
  .modal .pay:disabled{opacity:.6;cursor:default}
  .modal .cancel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px 16px;cursor:pointer}
  .modal .mmsg{margin-top:12px;font-size:14px;min-height:18px;color:#ffb3b5}
  .modal .hint{color:var(--muted);font-size:12px;margin-top:6px}
  .codebox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;word-break:break-all;
    white-space:pre-wrap;user-select:all}
  .okmsg{color:#9fe8bd;font-weight:600;margin-bottom:8px}
  .copybtn{margin-top:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .orow{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .orow:hover{border-color:var(--accent)}
  .orow .ot{font-weight:600;flex:1 1 auto;min-width:0}
  .orow .od{color:var(--muted);font-size:13px}
  .st{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
  .st.done{color:#bff3d2;background:#0f2f1e;border-color:#1e5a37}
  .st.work{color:#ffe0bf;background:#2f2314;border-color:#5a3a22}
  .st.bad{color:#ffd0d2;background:#2f1314;border-color:#5a2122}
  .st.ref{color:#cdbff3;background:#1e1a2f;border-color:#3a2f5a}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
  .kv .k{color:var(--muted);font-size:14px}.kv .v{font-weight:600}
  .bar2{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar2 i{display:block;height:100%;background:var(--accent)}
  .loginbtn{background:var(--accent);color:#1a0f07;padding:7px 15px;border-radius:999px;font-weight:700}
  .auth button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
  h1{font-size:18px;margin:20px 0 6px}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    color:var(--muted);font-size:14px;margin:18px 0 10px}
  .crumbs b{color:var(--text)}
  .crumbs .sep{opacity:.5}
  .back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    color:var(--accent2);font-size:14px;margin:10px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;margin:12px 0 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .t{font-weight:600}
  .card .arrow{margin-top:auto;color:var(--muted);font-size:13px}
  .vlist{display:flex;flex-direction:column;gap:10px;margin:12px 0 40px}
  .vrow{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .vrow .vt{font-weight:600;flex:1 1 180px;min-width:0}
  .vrow .desc{flex-basis:100%;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .price{font-weight:700;font-size:17px;white-space:nowrap}
  .price small{color:var(--muted);font-weight:500;font-size:12px}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.ok{color:#bff3d2;background:#0f2f1e;border:1px solid #1e5a37}
  .badge.bad{color:#ffd0d2;background:#2f1314;border:1px solid #5a2122}
  .buy{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:10px;
    padding:9px 16px;font-weight:700;cursor:not-allowed}
  .buy.active{background:var(--accent);color:#1a0f07;border:none;cursor:pointer;opacity:1}
  .buy.active:hover{filter:brightness(1.05)}
  .state{color:var(--muted);padding:40px 0;text-align:center}
  footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);
    padding:20px 0 40px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Vall<span>Shop</span></div>
  <div id="auth" class="auth"></div>
</div></header>

<main class="wrap">
  <div id="crumbs" class="crumbs"></div>
  <div id="content"><div class="state">Загрузка каталога…</div></div>
</main>

<div id="ordovl" class="ovl">
  <div class="modal">
    <h3 id="ordtitle">Заказ</h3>
    <div id="ordbody"></div>
    <div class="row">
      <button class="cancel" onclick="closeOrder()">Закрыть</button>
    </div>
  </div>
</div>

<div id="buyovl" class="ovl">
  <div class="modal">
    <h3 id="buytitle">Покупка</h3>
    <div id="buyprice" class="hint"></div>
    <div id="buyunamewrap" style="display:none">
      <label>Telegram @username получателя</label>
      <input id="buyuname" type="text" autocomplete="off" placeholder="username (без @)">
      <div class="hint">Зачисление придёт на этот Telegram-аккаунт.</div>
    </div>
    <div id="buylinkwrap" style="display:none">
      <label>Ссылка для накрутки</label>
      <input id="buylink" type="text" autocomplete="off" placeholder="https://t.me/... или ссылка на пост/профиль">
    </div>
    <div id="buysteamwrap" style="display:none">
      <label>Логин Steam</label>
      <input id="buysteamlogin" type="text" autocomplete="off" placeholder="ваш логин Steam (не email)">
      <label>Валюта пополнения</label>
      <select id="buysteamcur"></select>
      <label>Сумма в валюте</label>
      <input id="buysteamamt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="например, 500">
    </div>
    <div id="buyqtywrap">
      <label id="buyqtylabel">Количество</label>
      <input id="buyqty" type="number" inputmode="numeric" min="1" step="1" value="1">
      <div id="buyqtyhint" class="hint"></div>
    </div>
    <div id="buytotal" class="hint" style="margin-top:8px"></div>
    <div id="buyresult" style="margin-top:14px"></div>
    <div class="mmsg" id="buymsg"></div>
    <div class="row">
      <button class="cancel" onclick="closeBuy()" id="buycancel">Отмена</button>
      <button class="pay" id="buybtn" onclick="doBuy()">Купить</button>
    </div>
  </div>
</div>

<div id="ovl" class="ovl">
  <div class="modal">
    <h3>Пополнить баланс</h3>
    <label>Сумма, ₽</label>
    <input id="amount" type="number" inputmode="numeric" min="50" step="1" placeholder="например, 500">
    <div class="chips" id="chips"></div>
    <div id="mhint" class="hint"></div>
    <label>Способ оплаты</label>
    <div id="methods" class="methods"><div class="hint">Загрузка способов…</div></div>
    <div class="mmsg" id="mmsg"></div>
    <div class="row">
      <button class="cancel" onclick="closeTopup()">Отмена</button>
      <button class="pay" id="paybtn" onclick="doTopup()" disabled>Перейти к оплате</button>
    </div>
  </div>
</div>

<footer class="wrap">VallShop · покупка товаров появится на следующем этапе.</footer>

<script>
const $ = (id) => document.getElementById(id);
const content = $("content"), crumbs = $("crumbs");
let stack = [];  // хлебные крошки: [{id, title}]
let vmap = {};   // id номинала -> данные (для покупки)

const rub = (n) => (n == null ? "—" : (Number.isInteger(n) ? n : n.toFixed(2)) + " ₽");

async function api(path){
  const r = await fetch(path, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function renderCrumbs(){
  const parts = ['<b style="cursor:pointer" onclick="goHome()">🏠 Каталог</b>'];
  stack.forEach((s, i) => {
    parts.push('<span class="sep">›</span>');
    const last = i === stack.length - 1;
    parts.push(last ? `<b>${esc(s.title)}</b>`
      : `<span style="cursor:pointer" onclick="goTo(${i})">${esc(s.title)}</span>`);
  });
  crumbs.innerHTML = parts.join(" ");
}

function esc(s){return (s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function productCard(p){
  const sub = p.has_children ? "📂 открыть" : "выбрать номинал";
  return `<div class="card" onclick="open_(${p.id}, '${esc(p.title).replace(/'/g,"\\'")}')">
    <div class="t">${esc(p.title)}</div>
    <div class="arrow">${sub} →</div></div>`;
}

function variantRow(v){
  vmap[v.id] = v;
  const price = v.price_rub == null ? "—" :
    `${rub(v.price_rub)}${v.per_1000 ? ' <small>/ 1000</small>' : ''}`;
  const badge = v.available
    ? `<span class="badge ok">${v.source==='stock' && v.stock!=null ? 'в наличии: '+v.stock : 'в наличии'}</span>`
    : `<span class="badge bad">нет в наличии</span>`;
  const lim = v.per_1000 && v.smm_min ? `<div class="desc">Количество: от ${v.smm_min} до ${v.smm_max||'—'}</div>` : '';
  const desc = v.description ? `<div class="desc">${esc(v.description)}</div>` : '';
  let btn;
  if(!v.buyable){
    btn = `<button class="buy" title="Скоро на сайте" disabled>Скоро</button>`;
  }else if(!v.available){
    btn = `<button class="buy" disabled>Нет в наличии</button>`;
  }else{
    btn = `<button class="buy active" onclick="openBuy(${v.id})">Купить</button>`;
  }
  return `<div class="vrow">
    <div class="vt">${esc(v.title)}</div>
    <div class="price">${price}</div>
    ${badge}
    ${btn}
    ${lim}${desc}
  </div>`;
}

async function goHome(){
  stack = [];
  renderCrumbs();
  content.innerHTML = '<div class="state">Загрузка…</div>';
  try{
    const data = await api("/api/catalog");
    if(!data.products.length){ content.innerHTML = '<div class="state">Каталог пуст.</div>'; return; }
    content.innerHTML = `<div class="grid">${data.products.map(productCard).join("")}</div>`;
  }catch(e){ content.innerHTML = '<div class="state">Не удалось загрузить каталог.</div>'; }
}

async function open_(id, title){
  stack.push({id, title});
  renderCrumbs();
  content.innerHTML = '<div class="state">Загрузка…</div>';
  try{
    const data = await api("/api/catalog/" + id);
    if(data.type === "category"){
      content.innerHTML = `<div class="grid">${data.children.map(productCard).join("")}</div>`;
    } else {
      const rows = data.variants.map(variantRow).join("");
      content.innerHTML = rows
        ? `<div class="vlist">${rows}</div>`
        : '<div class="state">Нет доступных номиналов.</div>';
    }
  }catch(e){ content.innerHTML = '<div class="state">Не удалось загрузить товар.</div>'; }
}

function goTo(i){
  const target = stack[i];
  stack = stack.slice(0, i);
  open_(target.id, target.title);
}

async function initAuth(){
  const el = $("auth");
  const token = localStorage.getItem("vs_token");
  if(!token){ el.innerHTML = '<a class="loginbtn" href="/login">Войти</a>'; return; }
  try{
    const r = await fetch("/api/auth/me", {headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw 0;
    const me = await r.json();
    const name = me.email || "Telegram";
    const bal = `<span class="bal">${rub(me.balance_rub)}</span>`;
    const link = me.telegram_linked ? "" :
      '<a class="loginbtn" href="/login" style="font-size:13px;padding:6px 12px">+ Telegram</a>';
    el.innerHTML = `${bal}<button class="topup" onclick="openTopup()">Пополнить</button>`
      + `<button onclick="showOrders()">Мои заказы</button>`
      + `<span class="email">${esc(name)}</span>${link}<button onclick="logout()">Выйти</button>`;
  }catch(e){
    localStorage.removeItem("vs_token");
    el.innerHTML = '<a class="loginbtn" href="/login">Войти</a>';
  }
}
function logout(){ localStorage.removeItem("vs_token"); location.reload(); }

// ── Пополнение баланса ───────────────────────────────────────────────────────
let topupMethod = null, topupMin = 50, topupMax = 50000;

async function openTopup(){
  const token = localStorage.getItem("vs_token");
  if(!token){ location.href = "/login"; return; }
  $("ovl").classList.add("show");
  $("mmsg").textContent = "";
  $("amount").value = "";
  topupMethod = null;
  try{
    const cfg = await api("/api/topup/methods");
    topupMin = cfg.min; topupMax = cfg.max;
    $("mhint").textContent = `От ${topupMin} до ${topupMax} ₽`;
    $("chips").innerHTML = [100,300,500,1000,3000].map(a =>
      `<span class="chip" onclick="setAmount(${a})">${a} ₽</span>`).join("");
    if(!cfg.methods.length){
      $("methods").innerHTML = '<div class="hint">Способы оплаты временно недоступны.</div>';
      return;
    }
    $("methods").innerHTML = cfg.methods.map(m =>
      `<div class="method" id="m-${m.id}" onclick="selMethod('${m.id}')">${esc(m.label)}</div>`).join("");
  }catch(e){
    $("methods").innerHTML = '<div class="hint">Не удалось загрузить способы оплаты.</div>';
  }
}
function closeTopup(){ $("ovl").classList.remove("show"); }
function setAmount(a){ $("amount").value = a; refreshPay(); }
function selMethod(id){
  topupMethod = id;
  document.querySelectorAll(".method").forEach(e => e.classList.remove("sel"));
  const el = $("m-"+id); if(el) el.classList.add("sel");
  refreshPay();
}
function refreshPay(){
  const amt = parseFloat($("amount").value);
  const ok = topupMethod && amt >= topupMin && amt <= topupMax;
  $("paybtn").disabled = !ok;
}
async function doTopup(){
  const token = localStorage.getItem("vs_token");
  const amount = String($("amount").value).trim();
  $("paybtn").disabled = true; $("mmsg").textContent = "";
  try{
    const r = await fetch("/api/topup", {method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body: JSON.stringify({amount, method: topupMethod})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !data.checkout_url){
      $("mmsg").textContent = data.detail || "Не удалось создать счёт.";
      refreshPay(); return;
    }
    // уходим на страницу оплаты провайдера; после оплаты вернёмся на сайт
    location.href = data.checkout_url;
  }catch(e){ $("mmsg").textContent = "Нет связи с сервером."; refreshPay(); }
}
document.getElementById("amount").addEventListener("input", refreshPay);
document.getElementById("ovl").addEventListener("click", (e)=>{ if(e.target.id==="ovl") closeTopup(); });

// ── Покупка товара ───────────────────────────────────────────────────────────
let buyVar = null;

let starsPrice = null, starsMin = 1, starsMax = 10000, starsTimer = null;

function openBuy(id){
  const token = localStorage.getItem("vs_token");
  if(!token){ location.href = "/login"; return; }
  const v = vmap[id];
  if(!v) return;
  buyVar = v;
  const kind = v.buy_kind || "simple";
  starsPrice = null;
  $("buytitle").textContent = "Покупка · " + v.title;
  $("buyresult").innerHTML = "";
  $("buymsg").textContent = ""; $("buymsg").className = "mmsg";
  $("buycancel").textContent = "Отмена";
  $("buybtn").style.display = "";
  // @username — для Звёзд/Премиум
  $("buyunamewrap").style.display = (kind==="stars"||kind==="premium") ? "" : "none";
  $("buyuname").value = "";
  // ссылка — для SMM
  $("buylinkwrap").style.display = (kind==="smm") ? "" : "none";
  $("buylink").value = "";
  // Steam — логин + валюта + сумма
  $("buysteamwrap").style.display = (kind==="steam") ? "" : "none";
  if(kind==="steam"){ $("buysteamlogin").value = ""; $("buysteamamt").value = ""; loadSteamConfig(); }
  // количество — для simple, stars, smm (у vpn/premium/steam скрыто)
  const showQty = (kind==="simple"||kind==="stars"||kind==="smm");
  $("buyqtywrap").style.display = showQty ? "" : "none";
  const q = $("buyqty");
  $("buyqtyhint").textContent = "";
  if(kind==="steam"){
    $("buyprice").textContent = "Цена рассчитывается по сумме пополнения";
  }else if(kind==="stars"){
    $("buyqtylabel").textContent = "Количество звёзд";
    $("buyprice").textContent = "Цена рассчитывается по количеству";
    q.value = ""; q.min = 1; q.max = 100000;
    loadStarsLimits();
  }else if(kind==="smm"){
    $("buyqtylabel").textContent = "Количество";
    $("buyprice").textContent = v.price_rub != null ? ("Цена: " + rub(v.price_rub) + " / 1000") : "";
    const lo = v.smm_min || 1, hi = v.smm_max || 1000000;
    $("buyqtyhint").textContent = `От ${lo} до ${hi}`;
    q.value = lo; q.min = lo; q.max = hi;
  }else{
    $("buyqtylabel").textContent = "Количество";
    $("buyprice").textContent = v.price_rub != null ? ("Цена: " + rub(v.price_rub)) : "";
    q.value = 1; q.min = 1;
    q.max = (v.source==="stock" && v.stock) ? v.stock : 999;
  }
  updateBuyTotal();
  $("buybtn").disabled = (kind==="stars"||kind==="steam");   // до ввода суммы/количества
  $("buyovl").classList.add("show");
}
function closeBuy(){ $("buyovl").classList.remove("show"); }
function buyKind(){ return (buyVar && buyVar.buy_kind) || "simple"; }
function buyQty(){
  const k = buyKind();
  if(k==="vpn"||k==="premium") return 1;
  return Math.max(1, parseInt($("buyqty").value||"1",10));
}
async function loadStarsLimits(){
  try{
    const d = await api("/api/buy/stars-quote");
    starsMin = d.min; starsMax = d.max;
    $("buyqtyhint").textContent = `От ${starsMin} до ${starsMax} звёзд`;
    $("buyqty").min = starsMin; $("buyqty").max = starsMax;
  }catch(e){}
}
async function refreshStarsPrice(){
  const q = parseInt($("buyqty").value||"0",10);
  starsPrice = null;
  if(!q){ $("buytotal").textContent = ""; $("buybtn").disabled = true; return; }
  if(q < starsMin || q > starsMax){
    $("buytotal").textContent = `Введите от ${starsMin} до ${starsMax}`;
    $("buybtn").disabled = true; return;
  }
  $("buytotal").textContent = "Расчёт цены…"; $("buybtn").disabled = true;
  try{
    const d = await api("/api/buy/stars-quote?quantity=" + q);
    if(d.price_rub != null){
      starsPrice = d.price_rub;
      $("buytotal").textContent = "Итого: " + rub(d.price_rub);
      $("buybtn").disabled = false;
    }else{ $("buytotal").textContent = `Введите от ${d.min} до ${d.max}`; }
  }catch(e){ $("buytotal").textContent = "Не удалось рассчитать цену."; }
}
let steamPrice = null, steamTimer = null, steamLoaded = false;
async function loadSteamConfig(){
  steamPrice = null;
  $("buytotal").textContent = "";
  if(!steamLoaded){
    try{
      const cfg = await api("/api/buy/steam-config");
      const sel = $("buysteamcur");
      sel.innerHTML = cfg.currencies.map(c => `<option value="${c.code}">${esc(c.label)}</option>`).join("");
      sel.onchange = () => updateBuyTotal();
      $("buysteamamt").addEventListener("input", updateBuyTotal);
      steamLoaded = true;
    }catch(e){}
  }
}
async function refreshSteamPrice(){
  const amt = String($("buysteamamt").value||"").trim();
  const cur = $("buysteamcur").value || "RUB";
  steamPrice = null;
  if(!amt || parseFloat(amt) <= 0){ $("buytotal").textContent = ""; $("buybtn").disabled = true; return; }
  $("buytotal").textContent = "Расчёт цены…"; $("buybtn").disabled = true;
  try{
    const d = await api(`/api/buy/steam-quote?amount=${encodeURIComponent(amt)}&currency=${encodeURIComponent(cur)}`);
    if(d.price_rub != null){
      steamPrice = d.price_rub;
      $("buytotal").textContent = "Итого: " + rub(d.price_rub);
      $("buybtn").disabled = false;
    }else{
      $("buytotal").textContent = "Сумма вне лимитов — измените сумму";
    }
  }catch(e){ $("buytotal").textContent = "Не удалось рассчитать цену."; }
}
function updateBuyTotal(){
  const k = buyKind();
  if(k==="steam"){
    clearTimeout(steamTimer);
    steamTimer = setTimeout(refreshSteamPrice, 400);
    return;
  }
  if(k==="stars"){
    clearTimeout(starsTimer);
    starsTimer = setTimeout(refreshStarsPrice, 400);
    return;
  }
  if(!buyVar || buyVar.price_rub == null){ $("buytotal").textContent = ""; return; }
  if(k==="smm"){
    // цена указана за 1000 единиц
    $("buytotal").textContent = "Итого: " + rub(buyVar.price_rub * buyQty() / 1000);
    return;
  }
  $("buytotal").textContent = "Итого: " + rub(buyVar.price_rub * buyQty());
}
async function doBuy(){
  const token = localStorage.getItem("vs_token");
  const kind = buyKind();
  const fields = {};
  if(kind==="stars"||kind==="premium"){
    const u = $("buyuname").value.trim().replace(/^@/,"");
    if(!/^[A-Za-z0-9_]{5,32}$/.test(u)){
      $("buymsg").textContent = "Укажите корректный Telegram @username (5–32 символа)."; return;
    }
    fields.telegram_username = u;
  }
  if(kind==="smm"){
    const link = $("buylink").value.trim();
    if(!link || link.indexOf(" ")>=0 || link.indexOf(".")<0){
      $("buymsg").textContent = "Пришлите корректную ссылку (например https://t.me/...)."; return;
    }
    fields.link = link;
  }
  if(kind==="steam"){
    const login = $("buysteamlogin").value.trim();
    const amt = String($("buysteamamt").value||"").trim();
    if(!login){ $("buymsg").textContent = "Укажите логин Steam."; return; }
    if(!amt || parseFloat(amt) <= 0){ $("buymsg").textContent = "Укажите сумму пополнения."; return; }
    fields.steam_login = login;
    fields.currency = $("buysteamcur").value || "RUB";
    fields.amount = amt;
  }
  $("buybtn").disabled = true; $("buymsg").textContent = ""; $("buymsg").className = "mmsg";
  try{
    const r = await fetch("/api/buy", {method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body: JSON.stringify({variant_id: buyVar.id, quantity: buyQty(), fields})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      $("buymsg").textContent = data.detail || "Не удалось оформить покупку.";
      if((data.detail||"").indexOf("Недостаточно") >= 0){
        $("buymsg").innerHTML = esc(data.detail) +
          ' <a href="#" onclick="closeBuy();openTopup();return false;" style="color:var(--accent)">Пополнить</a>';
      }
      $("buybtn").disabled = false;
      return;
    }
    showBuyResult(data);
    initAuth();                      // обновить баланс в шапке
    const cur = stack[stack.length-1];
    if(cur) refreshVariants(cur.id); // обновить остаток в наличии
  }catch(e){ $("buymsg").textContent = "Нет связи с сервером."; $("buybtn").disabled = false; }
}
function showBuyResult(d){
  $("buybtn").style.display = "none";
  $("buycancel").textContent = "Закрыть";
  let html = `<div class="okmsg">${esc(d.message||"Готово!")}</div>`;
  if(d.kind === "codes" && d.codes){
    const text = d.codes.join("\n");
    html += `<div class="codebox" id="codebox">${esc(text)}</div>`
      + `<button class="copybtn" onclick="copyText(${JSON.stringify(text)})">Скопировать</button>`;
  }else if(d.kind === "vpn" && d.link){
    html += `<div class="codebox"><a href="${esc(d.link)}" style="color:var(--accent2)">${esc(d.link)}</a></div>`
      + `<button class="copybtn" onclick="copyText(${JSON.stringify(d.link)})">Скопировать ссылку</button>`;
  }else{
    html += `<a href="#" class="copybtn" onclick="closeBuy();openOrder(${d.order_id});return false;">Открыть заказ в «Мои заказы»</a>`;
  }
  $("buyresult").innerHTML = html;
}
function copyText(t){ navigator.clipboard && navigator.clipboard.writeText(t); }

// тихо перезагрузить список номиналов текущего товара (обновить остатки)
async function refreshVariants(productId){
  try{
    const data = await api("/api/catalog/" + productId);
    if(data.type === "product"){
      const rows = data.variants.map(variantRow).join("");
      if(stack.length && stack[stack.length-1].id === productId)
        content.innerHTML = rows ? `<div class="vlist">${rows}</div>`
          : '<div class="state">Нет доступных номиналов.</div>';
    }
  }catch(e){}
}

document.getElementById("buyqty").addEventListener("input", updateBuyTotal);
document.getElementById("buyovl").addEventListener("click", (e)=>{ if(e.target.id==="buyovl") closeBuy(); });

// ── Мои заказы ───────────────────────────────────────────────────────────────
function _stClass(s){
  if(s==="completed") return "done";
  if(s==="refunded") return "ref";
  if(s==="failed"||s==="needs_action"||s==="expired") return "bad";
  return "work";
}
function _fmtDate(iso){
  if(!iso) return "";
  try{ return new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return iso; }
}
async function showOrders(){
  const token = localStorage.getItem("vs_token");
  if(!token){ location.href="/login"; return; }
  stack = [];
  crumbs.innerHTML = '<b style="cursor:pointer" onclick="goHome()">🏠 Каталог</b> <span class="sep">›</span> <b>Мои заказы</b>';
  content.innerHTML = '<div class="state">Загрузка…</div>';
  try{
    const r = await fetch("/api/orders", {headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw 0;
    const data = await r.json();
    if(!data.orders.length){ content.innerHTML = '<div class="state">У вас пока нет заказов.</div>'; return; }
    content.innerHTML = '<div class="vlist">' + data.orders.map(orderRow).join("") + '</div>';
  }catch(e){ content.innerHTML = '<div class="state">Не удалось загрузить заказы.</div>'; }
}
function orderRow(o){
  const prog = (typeof o.progress === "number") ? ` · ${o.progress}%` : "";
  return `<div class="orow" onclick="openOrder(${o.id})">
    <div class="ot">${esc(o.title)}<div class="od">#${o.id} · ${esc(_fmtDate(o.created_at))}</div></div>
    <div class="price">${rub(o.total_rub)}</div>
    <span class="st ${_stClass(o.status)}">${esc(o.status_label)}${prog}</span>
  </div>`;
}
async function openOrder(id){
  const token = localStorage.getItem("vs_token");
  $("ordtitle").textContent = "Заказ #" + id;
  $("ordbody").innerHTML = '<div class="hint">Загрузка…</div>';
  $("ordovl").classList.add("show");
  try{
    const r = await fetch("/api/orders/"+id, {headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw 0;
    renderOrderDetail(await r.json());
  }catch(e){ $("ordbody").innerHTML = '<div class="mmsg">Не удалось загрузить заказ.</div>'; }
}
function closeOrder(){ $("ordovl").classList.remove("show"); }
function renderOrderDetail(o){
  $("ordtitle").textContent = o.title;
  let h = "";
  const kv = (k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  h += kv("Заказ", "#"+o.id);
  h += kv("Количество", o.quantity);
  h += kv("Сумма", rub(o.total_rub));
  h += kv("Статус", `<span class="st ${_stClass(o.status)}">${esc(o.status_label)}</span>`);
  if(o.info && o.info.length){
    o.info.forEach(f => { h += kv(esc(f.label), esc(String(f.value))); });
  }
  if(o.smm){
    if(o.smm.link) h += kv("Ссылка", `<a href="${esc(o.smm.link)}" style="color:var(--accent2)">ссылка</a>`);
    if(typeof o.smm.progress === "number"){
      h += kv("Выполнено", (o.smm.done!=null && o.smm.quantity!=null) ? `${o.smm.done} из ${o.smm.quantity}` : o.smm.progress+"%");
      h += `<div class="bar2"><i style="width:${o.smm.progress}%"></i></div>`;
    }
  }
  if(o.note) h += `<div class="hint" style="margin-top:10px">${esc(o.note)}</div>`;
  if(o.codes && o.codes.length){
    const text = o.codes.join("\n");
    h += `<div class="okmsg" style="margin-top:12px">Выдача:</div><div class="codebox">${esc(text)}</div>`
      + `<button class="copybtn" onclick="copyText(${JSON.stringify(text)})">Скопировать</button>`;
  }
  if(o.vpn_link){
    h += `<div class="okmsg" style="margin-top:12px">Ссылка на подписку VPN:</div>`
      + `<div class="codebox"><a href="${esc(o.vpn_link)}" style="color:var(--accent2)">${esc(o.vpn_link)}</a></div>`
      + `<button class="copybtn" onclick="copyText(${JSON.stringify(o.vpn_link)})">Скопировать</button>`;
  }
  if(o.status!=="completed" && !o.codes && !o.vpn_link && !o.smm){
    h += `<div class="hint" style="margin-top:12px">Заказ обрабатывается. Обновите страницу позже.</div>`;
  }
  $("ordbody").innerHTML = h;
}
document.getElementById("ordovl").addEventListener("click", (e)=>{ if(e.target.id==="ordovl") closeOrder(); });

initAuth();
goHome();
</script>
