<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop — отзывы покупателей</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ff8a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13100e; --bg2:#0e0c0a; --panel:#1d1813; --panel2:#251f18;
    --line:#352c22; --line2:#43382b; --text:#f7f2ec; --muted:#bcae9e; --dim:#8c7f70;
    --accent:#ff8a2e; --accent2:#ffc27a; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1100px 500px at 78% -8%, rgba(255,122,43,.10), transparent 60%),var(--bg);
    color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:5;background:rgba(14,15,19,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;padding:14px 0}
  .logo{font-family:"Kaushan Script",cursive;font-size:30px;color:#fff;cursor:pointer;line-height:1;padding-bottom:3px}
  .logo span{color:var(--accent)}
  .back{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px;border:1px solid var(--line2);
    padding:8px 16px;border-radius:999px;transition:.15s}
  .back:hover{border-color:var(--accent);color:#fff}
  h1{font-size:30px;margin:28px 0 4px;font-weight:900;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0 0 22px}
  .reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:40px}
  .rev{background:linear-gradient(180deg,var(--panel),#171310);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
    opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  .rev.in{opacity:1;transform:none}
  .rev .stars{color:var(--accent);font-size:16px;letter-spacing:2px}
  .rev .rtitle{font-weight:700;font-size:14px;margin:6px 0 8px;color:var(--muted)}
  .rev .rtext{font-size:14.5px;line-height:1.6;color:var(--text);white-space:pre-wrap}
  .rev .rwho{color:var(--dim);font-size:12px;margin-top:12px}
  .state{color:var(--muted);padding:60px 0;text-align:center}
  footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;padding:22px 0;text-align:center;margin-top:20px}
  @media (max-width:640px){h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a href="/" class="logo">Vall<span>Shop</span></a>
  <a href="/" class="back">← на витрину</a>
</div></header>
<main class="wrap">
  <h1>Отзывы покупателей</h1>
  <p class="sub">Реальные отзывы о заказах в нашем магазине.</p>
  <div id="list"><div class="state">Загрузка…</div></div>
</main>
<footer class="wrap">© VallShop · <span id="year"></span> · отзывы покупателей</footer>
<script>
const esc = (s)=> (s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById("year").textContent = new Date().getFullYear();
const starStr = (n)=>{ n=Math.max(0,Math.min(5,n||0));
  return '★'.repeat(n)+'<span style="color:var(--line2)">'+'★'.repeat(5-n)+'</span>'; };
(async ()=>{
  const list = document.getElementById("list");
  try{
    const r = await fetch("/api/reviews?limit=30");
    const data = await r.json();
    if(!data.reviews || !data.reviews.length){
      list.innerHTML = '<div class="state">Отзывов пока нет — станьте первым!</div>'; return;
    }
    list.innerHTML = '<div class="reviews">' + data.reviews.map(rv => `
      <div class="rev">
        <div class="stars">${starStr(rv.rating)}</div>
        ${rv.product_title?`<div class="rtitle">${esc(rv.product_title)}</div>`:''}
        <div class="rtext">${esc(rv.text||'')}</div>
        <div class="rwho">${rv.username?('@'+esc(rv.username)):'Покупатель'}</div>
      </div>`).join("") + '</div>';
    // reveal-on-scroll
    const obs = new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);} }),{threshold:.06});
    document.querySelectorAll(".rev").forEach((el,i)=>{ el.style.transitionDelay=Math.min(i*40,240)+"ms"; obs.observe(el); });
  }catch(e){ list.innerHTML = '<div class="state">Не удалось загрузить отзывы.</div>'; }
})();
</script>
</body>
</html>
