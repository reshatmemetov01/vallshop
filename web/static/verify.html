<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop — подтверждение email</title>
<style>
  :root{--bg:#0e1116;--panel:#171b22;--line:#2a303a;--text:#e8edf3;--muted:#8b96a5;
    --accent:#ff7a2f;--accent2:#2fb4a6;--ok:#36c26b;--bad:#e5484d;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:flex;
    align-items:center;justify-content:center;padding:24px 16px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px;text-align:center}
  .logo{font-weight:800;font-size:22px;margin-bottom:18px}.logo span{color:var(--accent)}
  h1{font-size:19px;margin:0 0 10px}
  p{color:var(--muted);margin:0 0 18px}
  .ok{color:#9fe8bd}.bad{color:#ffb3b5}
  .btn{display:inline-block;background:var(--accent);color:#1a0f07;text-decoration:none;
    font-weight:700;padding:12px 22px;border-radius:10px}
  .spin{color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Vall<span>Shop</span></div>
    <h1 id="title">Подтверждение email</h1>
    <p id="msg" class="spin">Проверяем ссылку…</p>
    <a id="go" class="btn" href="/" style="display:none">На витрину</a>
  </div>
<script>
const $ = (id)=>document.getElementById(id);
(async ()=>{
  const token = new URLSearchParams(location.search).get("token");
  if(!token){ fail("Ссылка неполная — нет кода подтверждения."); return; }
  try{
    const r = await fetch("/api/auth/verify", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({token})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ fail(data.detail || "Не удалось подтвердить email."); return; }
    $("title").textContent = "Email подтверждён ✅";
    $("msg").className = "ok"; $("msg").textContent = "Спасибо! Ваш адрес подтверждён.";
    $("go").style.display = "inline-block";
  }catch(e){ fail("Нет связи с сервером."); }
})();
function fail(text){
  $("title").textContent = "Ошибка"; $("msg").className = "bad"; $("msg").textContent = text;
  $("go").style.display = "inline-block";
}
</script>
</body>
</html>
