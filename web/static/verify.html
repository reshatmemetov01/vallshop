<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VallShop — подтверждение email</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ff8a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{--bg:#13100e;--bg2:#0e0c0a;--panel:#1d1813;--line2:#43382b;--text:#f7f2ec;--muted:#bcae9e;
    --accent:#ff8a2e;--accent-ink:#2a1505;--grad:linear-gradient(135deg,#ffb24d,#ff6f1e)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--text);
    background:radial-gradient(900px 440px at 50% -10%, rgba(255,122,43,.12), transparent 65%),var(--bg);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  .card{width:100%;max-width:420px;background:linear-gradient(180deg,#1c1710,#171310);border:1px solid var(--line2);
    border-radius:20px;padding:30px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .logo{font-family:"Kaushan Script",cursive;font-size:30px;color:#fff;margin-bottom:16px;line-height:1}.logo span{color:var(--accent)}
  h1{font-size:20px;margin:0 0 10px;font-weight:800}
  p{color:var(--muted);margin:0 0 18px}
  .ok{color:#9fe8bd}.bad{color:#ffb3b5}
  .btn{display:inline-block;background:var(--grad);color:var(--accent-ink);text-decoration:none;
    font-weight:800;padding:12px 24px;border-radius:12px}
  .spin{color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Vall<span>Shop</span></div>
    <h1 id="title">Подтверждение email</h1>
    <p id="msg" class="spin">Проверяем ссылку…</p>
    <a id="go" class="btn" href="/" style="display:none">На витрину</a>
  </div>
<script>
const $ = (id)=>document.getElementById(id);
(async ()=>{
  const token = new URLSearchParams(location.search).get("token");
  if(!token){ fail("Ссылка неполная — нет кода подтверждения."); return; }
  try{
    const r = await fetch("/api/auth/verify", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({token})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ fail(data.detail || "Не удалось подтвердить email."); return; }
    $("title").textContent = "Email подтверждён ✅";
    $("msg").className = "ok"; $("msg").textContent = "Спасибо! Ваш адрес подтверждён.";
    $("go").style.display = "inline-block";
  }catch(e){ fail("Нет связи с сервером."); }
})();
function fail(text){
  $("title").textContent = "Ошибка"; $("msg").className = "bad"; $("msg").textContent = text;
  $("go").style.display = "inline-block";
}
</script>
</body>
</html>
